<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#2e9e5b" />
<title>Muslim Kids — Apprendre l'islam en s'amusant</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app">
    <header class="topbar">
      <button id="btnBack" class="icon-btn hidden" aria-label="Retour">←</button>
      <h1 id="topTitle">Muslim Kids</h1>
      <div class="badge-pill" id="badgeStars" title="Étoiles">⭐ <span id="starCount">0</span></div>
      <div class="badge-pill gold" id="badgeCoins" title="Pièces">🪙 <span id="coinCount">0</span></div>
      <div class="badge-pill level" id="badgeLevel" title="Niveau">🎖️ <span id="levelCount">1</span></div>
      <button id="btnSupport" class="icon-btn" aria-label="Soutenir" title="Soutenir le créateur">❤️</button>
      <button id="btnSound" class="icon-btn" aria-label="Activer / couper le son">🔊</button>
    </header>

    <main id="screen" class="screen"></main>
  </div>

  <div id="overlay" class="overlay hidden"></div>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
